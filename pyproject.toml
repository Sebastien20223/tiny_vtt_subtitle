[project]
name = "tiny-vtt-subtitle"
version = "0.1.0"
description = "Reads and writes WebVTT subtitle files in Python, with no dependencies."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
